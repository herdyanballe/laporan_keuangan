<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kas Narogong</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kas Narogong">
    <meta name="theme-color" content="#1F4E79">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1F4E79;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .splash img {
            width: 80px;
            height: 80px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="splash" id="splash">
        <img src="icons/icon-144.png" alt="Kas Narogong">
    </div>
    <iframe id="appFrame" src="https://herdyanballe-laporan-keuangan.streamlit.app/?embed=true"></iframe>
    <script>
        // Hilangkan splash screen setelah iframe load
        const iframe = document.getElementById('appFrame');
        const splash = document.getElementById('splash');
        
        iframe.addEventListener('load', function() {
            setTimeout(() => {
                splash.style.display = 'none';
            }, 1000);
        });
        
        // Daftarkan service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('Service Worker registered:', reg))
                .catch(err => console.log('Service Worker error:', err));
        }
    </script>
</body>
</html>
